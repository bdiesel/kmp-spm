org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 opt-outs: keep com.android.application + kotlin.multiplatform in one module.
# Temporary; remove once composeApp is split into an :androidApp module.
android.builtInKotlin=false
android.newDsl=false

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
