org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# SpaceSdk publishing (Maven coordinates for :space-sdk and :space-api).
# Credentials for GitHub Packages are NOT stored here: set gpr.user / gpr.key in
# ~/.gradle/gradle.properties, or GITHUB_ACTOR / GITHUB_TOKEN in the environment.
spacesdk.group=io.github.bdiesel.spacesdk
spacesdk.version=0.1.0
spacesdk.githubRepo=bdiesel/kmp-spm

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
